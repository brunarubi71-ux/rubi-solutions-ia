<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Vila Anchieta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F0EB; --surface:#FFFFFF; --surface2:#FAF7F3; --ink:#262320; --muted:#7A716A;
  --line:#E6DED5; --brand:#8D634B; --brand-dark:#6E4B37; --brand-soft:#EFE4DB;
  --ok:#2F7D5B; --ok-soft:#E3F1EA; --warn:#B26B0A; --warn-soft:#FBEFD9;
  --danger:#B4443A; --danger-soft:#F8E3E0; --radius:14px;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 16px rgba(60,40,20,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-size:15px;line-height:1.45;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* Demo banner */
.demo{background:var(--brand-dark);color:#F6EEE7;font-size:13px;padding:8px 16px;text-align:center}
.demo b{font-weight:600}
.demo button{background:none;border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:1px 10px;margin-left:8px;font-size:12px;color:#fff}

/* Header */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{width:44px;height:44px;border-radius:50%;border:1px solid var(--line)}
.brand .t1{letter-spacing:.18em;font-weight:500;font-size:14px}
.brand .t2{letter-spacing:.14em;font-size:10.5px;color:var(--brand);text-transform:uppercase}
.roles{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:30px;padding:3px;overflow-x:auto;max-width:100%}
.roles button{border:0;background:none;padding:6px 14px;border-radius:30px;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.roles button.on{background:var(--brand);color:#fff}
.sub{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.sub button{border:0;background:none;padding:10px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.sub button.on{color:var(--ink);border-color:var(--brand);font-weight:500}
.pill{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11.5px;text-align:center;margin-left:4px}

main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-weight:500;font-size:24px;letter-spacing:.01em}
h2{font-weight:500;font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-dark)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.ro{font-size:12px;background:var(--brand-soft);color:var(--brand-dark);padding:3px 10px;border-radius:20px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:500;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.alert{border-color:#E9B8B2;background:var(--danger-soft);cursor:pointer}
.kpi.alert .v{color:var(--danger)}
.kpi.warn{border-color:#EFCF96;background:var(--warn-soft)}
.kpi.warn .v{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:start}
.stack{display:grid;gap:16px}
.grid2>*,.stack>*{min-width:0}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 9px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}

table{width:100%;border-collapse:collapse}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tscroll{overflow-x:auto;margin:0 -18px;padding:0 18px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
tr.total td{font-weight:500;border-top:2px solid var(--line)}
.bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px}
.in{color:var(--ok)} .out{color:var(--danger)}

.badge{font-size:12px;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-muted{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

.ev{padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px}
.ev .name{font-weight:500}
.ev .meta{font-size:12.5px;color:var(--muted)}
.ev .bar{height:8px;margin:6px 0 4px}

.pend{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pend:last-child{border-bottom:0}
.pend .txt{flex:1;font-size:14px}
.pend .txt small{display:block;color:var(--muted);font-size:12.5px}

.feed .row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed .row:last-child{border-bottom:0}
.feed .row .d{flex:1;min-width:0}
.feed .row .d small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new{animation:flash 2.4s ease}
@keyframes flash{0%,40%{background:#FFF3C9}100%{background:transparent}}
.newtag{font-size:10.5px;background:#F2C94C;color:#4A3500;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select,input[type=text],input[type=number],input[type=date],input[type=time]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px;max-width:100%}
select:focus,input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}

.nid{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.nid:last-child{border-bottom:0}
.nid .who{font-weight:500}
.nid .meta{font-size:12.5px;color:var(--muted)}
.nid .val{font-size:18px;font-weight:500;text-align:right}
.nid .ctrl{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sug{font-size:12.5px;background:var(--brand-soft);color:var(--brand-dark);padding:4px 10px;border-radius:8px;cursor:pointer;border:0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty b{display:block;color:var(--ok);font-size:17px;font-weight:500;margin-bottom:4px}

/* Agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--surface2);font-size:11.5px;color:var(--muted);text-align:center;padding:6px 0;letter-spacing:.06em}
.cal .dc{background:var(--surface);min-height:92px;padding:5px;font-size:12px;overflow:hidden}
.cal .dc.off{background:var(--surface2);color:#bbb}
.cal .dc.today .n{background:var(--brand);color:#fff;border-radius:50%}
.cal .n{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-bottom:2px}
.cal .e{display:block;border-radius:5px;padding:1px 5px;margin-top:2px;color:#fff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .c{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .conf{outline:2px solid var(--danger);outline-offset:-2px}
@media (max-width:640px){
  .cal .dc{min-height:54px;padding:3px}
  .cal .e{font-size:0;height:6px;padding:0;margin-top:3px}
  .cal .c{display:none}
}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}

/* Leader */
.evcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2)}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ask{border:1px solid #EFCF96;background:var(--warn-soft);border-radius:12px;padding:14px;margin-bottom:12px}

/* Member */
.phone{max-width:460px;margin:0 auto}
.hint{background:var(--surface);border:1px dashed var(--brand);color:var(--brand-dark);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;text-align:center}
.hero{text-align:center;padding:10px 0 18px}
.hero img{width:130px;height:130px;border-radius:50%;box-shadow:var(--shadow)}
.hero h1{font-size:21px;margin-top:10px}
.hero p{color:var(--muted);font-size:14px}
.opt{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);width:100%;text-align:left}
.opt:hover{border-color:var(--brand)}
.opt .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--brand-dark)}
.opt .tx{flex:1}
.opt .tx b{font-weight:500;display:block}
.opt .tx small{color:var(--muted)}
.opt .pr{font-weight:500}
.sec{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);margin:18px 0 8px}

/* Modal */
#ov{position:fixed;inset:0;background:rgba(38,35,32,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#ov.show{display:flex}
#modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal.wide{max-width:760px}
.x{position:absolute;top:12px;right:12px;border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
#modal h3{font-weight:500;font-size:19px;margin-bottom:4px;padding-right:30px}
#modal .lead{color:var(--muted);font-size:14px;margin-bottom:16px}
.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.f label input,.f label select{width:100%;color:var(--ink)}
.f .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warnbox{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13.5px}
.infobox{background:var(--brand-soft);color:var(--brand-dark);border-radius:10px;padding:10px 12px;font-size:13.5px}
.qr{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0}
.qr svg{width:190px;height:190px;border:8px solid #fff;box-shadow:0 0 0 1px var(--line);border-radius:6px}
.copy{display:flex;gap:6px;width:100%}
.copy input{flex:1;font-size:12px;color:var(--muted)}
.success{text-align:center;padding:10px 0}
.success .ck{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:10px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;transition:transform .3s,opacity .3s;opacity:0;visibility:hidden;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}

.rep h4{font-weight:500;margin:16px 0 6px}
.rep .rh{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:6px}
.rep .rh img{width:56px;height:56px;border-radius:50%}
@media print{
  body *{visibility:hidden}
  #modal .rep,#modal .rep *{visibility:visible}
  #modal .rep{position:absolute;left:0;top:0;width:100%}
  #ov{background:none}
}
@media (max-width:560px){
  h1{font-size:21px}
  .kpi .v{font-size:20px}
  .f .row2{grid-template-columns:1fr}
  .brand .t2{display:none}
  .hidem{display:none}
}
</style>
</head>

function addTx(t){ const x = Object.assign({id:uid++,min:null,ev:null,receipt:true},t); S.tx.push(x); S.fresh.add(x.id); return x; }
const evById = id => S.events.find(e => e.id === id);

/* ---------- calculations ---------- */
const okIn = t => t.type==='in' && t.status==='ok';
const sum = arr => arr.reduce((a,t)=>a+t.amount,0);
function totals(min){
  const txs = min ? S.tx.filter(t=>t.min===min) : S.tx;
  const inn = sum(txs.filter(okIn)), out = sum(txs.filter(t=>t.type==='out'));
  return {inn,out,bal:inn-out};
}
const unident = () => S.tx.filter(t => t.status==='naoid' || t.status==='consulta');
const toCheck = () => S.tx.filter(t => t.status==='conferir');
const noReceipt = () => S.tx.filter(t => t.type==='out' && !t.receipt);
const evPaid = e => S.tx.filter(t => t.ev===e.id && okIn(t));

/* ---------- render ---------- */
const canEdit = () => S.role==='tes';
function render(){
  const roles = [['tes','Tesouraria'],['pastor','Pastor'],['lider','Líder de ministério'],['membro','Membro (link público)']];
  document.getElementById('roles').innerHTML = roles.map(([k,l])=>`<button data-act="role" data-v="${k}" class="${S.role===k?'on':''}">${l}</button>`).join('');
  let tabs = [];
  if(S.role==='tes'||S.role==='pastor') tabs = [['painel','Painel'],['lanc','Lançamentos'],['naoid','Não identificados'],['agenda','Agenda']];
  if(S.role==='lider') tabs = [['lider','Meu ministério'],['agenda','Agenda']];
  const nid = unident().length;
  document.getElementById('sub').innerHTML = tabs.map(([k,l])=>`<button data-act="view" data-v="${k}" class="${S.view===k?'on':''}">${l}${k==='naoid'&&nid?`<span class="pill">${nid}</span>`:''}</button>`).join('');
  document.getElementById('sub').style.display = tabs.length ? '' : 'none';
  const V = {painel:vPainel,lanc:vLanc,naoid:vNaoid,agenda:vAgenda,lider:vLider,membro:vMembro};
  document.getElementById('main').innerHTML = V[S.view]();
  setTimeout(()=>S.fresh.clear(), 50);
}
const minChip = id => { const m = minById(id); return m ? `<span class="chip"><span class="dot" style="background:${m.color}"></span>${m.short}</span>` : `<span class="chip" style="color:var(--danger)">Sem origem</span>`; };
function statusBadge(t){
  if(t.type==='out') return t.receipt ? '<span class="badge b-muted">Despesa · com comprovante</span>' : '<span class="badge b-warn">Despesa · sem comprovante</span>';
  return {ok:'<span class="badge b-ok">Identificado</span>',conferir:'<span class="badge b-warn">A conferir</span>',
          naoid:'<span class="badge b-danger">Não identificado</span>',consulta:'<span class="badge b-warn">Consultando líder</span>'}[t.status];
}
const bar = (pct,color) => `<div class="bar"><i style="width:${Math.min(100,Math.max(0,pct))}%;background:${color}"></i></div>`;

      <td class="r num in">${fmt(t.inn)}</td><td class="r num out">${fmt(t.out)}</td><td class="r num"><b style="font-weight:500">${fmt(t.bal)}</b></td>
      <td class="hidem" style="width:18%">${bar(t.inn/maxIn*100,m.color)}</td></tr>`; }).join('');

      <div class="meta">${minChip(e.min)} &nbsp;${fdl(e.date)} · ${p.length} de ${e.cap} inscritos · ${fmt(e.price)}</div>${bar(p.length/e.cap*100,m.color)}</div>`; }).join('');

      ${t.min?`<span class="dot" style="background:${minById(t.min).color}"></span>`:'<span class="dot" style="background:var(--danger)"></span>'}

      <span class="num ${t.type}">${t.type==='out'?'−':'+'}${fmt(t.amount)}</span></div>`).join('');

  <div class="kpis">
    <div class="kpi"><div class="l">Entradas identificadas</div><div class="v num in">${fmt(T.inn)}</div><div class="s">${S.tx.filter(okIn).length} lançamentos</div></div>
    <div class="kpi"><div class="l">Saídas</div><div class="v num out">${fmt(T.out)}</div><div class="s">${S.tx.filter(t=>t.type==='out').length} despesas</div></div>
    <div class="kpi"><div class="l">Saldo do mês</div><div class="v num">${fmt(T.bal)}</div><div class="s">todos os ministérios</div></div>
    <div class="kpi ${nid.length?'alert':''}" data-act="view" data-v="naoid"><div class="l">Sem origem identificada</div><div class="v num">${fmt(sum(nid))}</div><div class="s">${nid.length} recebimentos · clique para classificar</div></div>
    <div class="kpi ${chk.length?'warn':''}"><div class="l">Dinheiro a conferir</div><div class="v num">${fmt(sum(chk))}</div><div class="s">${chk.length} entregas de líderes</div></div>
  </div>
  <div class="grid2">
    <div class="stack">
      <div class="card"><h2>Por ministério</h2><div class="tscroll"><table>

        ${chk.map(t=>`<div class="pend"><span class="dot" style="background:${minById(t.min).color}"></span><div class="txt">${minById(t.min).short} entregou ${fmt(t.amount)}<small>${esc(t.desc)} · ${t.method} · ${fd(t.date)} · foto anexada</small></div>${canEdit()?`<button class="btn sm ok" data-act="confirm" data-id="${t.id}">Confirmar</button>`:''}</div>`).join('')}
        ${nr.map(t=>`<div class="pend"><span class="dot" style="background:${minById(t.min).color}"></span><div class="txt">Despesa sem comprovante<small>${minById(t.min).short} · ${esc(t.desc)} · ${fmt(t.amount)}</small></div><button class="btn sm" data-act="cobrar" data-id="${t.id}">Cobrar líder</button></div>`).join('')}
        ${!nid.length&&!chk.length&&!nr.length?'<div class="empty"><b>Tudo em dia ✓</b>Nenhuma pendência.</div>':''}
      </div>
      <div class="card feed"><h2>Últimas movimentações <span class="badge b-ok">ao vivo</span></h2>${feed}</div>

}

function vAgenda(){
  const y = S.agY, m = S.agM, first = new Date(y,m,1), start = new Date(y,m,1-first.getDay());
  const byDay = {}; S.events.forEach(e => { const k = e.date.toDateString(); (byDay[k]=byDay[k]||[]).push(e); });
  let cells = '';
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if(i>=35 && d.getMonth()!==m) break;

    cells += `<div class="dc ${d.getMonth()!==m?'off':''} ${sameDay(d,TODAY)?'today':''} ${evs.length>1?'conf':''}"><span class="n">${d.getDate()}</span>
      ${culto&&d.getMonth()===m?`<span class="c">${culto}</span>`:''}
      ${evs.map(e=>`<span class="e" style="background:${minById(e.min).color}" title="${esc(e.name)}">${e.time.slice(0,2)}h ${esc(e.name)}</span>`).join('')}</div>`;
  }
  const monthEvs = S.events.filter(e=>e.date.getMonth()===m&&e.date.getFullYear()===y).sort((a,b)=>a.date-b.date);
  return `<div class="head"><div><div class="eyebrow">Agenda unificada · todos os ministérios</div><h1>${MONTHS[m]} de ${y}</h1></div>
    <div class="actions"><button class="btn" data-act="agPrev">‹</button><button class="btn" data-act="agNext">›</button>
    ${S.role!=='pastor'?'<button class="btn pri" data-act="newEvent">+ Novo evento</button>':''}</div></div>

  <div class="card" style="margin-top:16px"><h2>Eventos do mês</h2>${monthEvs.map(e=>`<div class="ev"><div class="top"><span class="name">${esc(e.name)}</span><span class="meta">${fdl(e.date)} · ${e.time}</span></div><div class="meta">${minChip(e.min)} &nbsp;${e.price?fmt(e.price):'Gratuito'} · ${evPaid(e).length}/${e.cap} inscritos</div></div>`).join('')||'<div class="empty">Nenhum evento neste mês.</div>'}</div>`;
}

function openModal(html, wide){ const m = document.getElementById('modal'); m.className = wide?'wide':''; m.innerHTML = '<button class="x" data-act="close">×</button>'+html; document.getElementById('ov').classList.add('show'); }

let tt; function toast(msg){ const t = document.getElementById('toast'); t.innerHTML = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 4200); }

function qrSvg(seedStr){
  let h = 0; for(const c of seedStr) h = (h*31 + c.charCodeAt(0))|0; const r = mulberry(h);
  const N = 25; let s = '';
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const inF = (x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9); if(!inF && r()<.5) s += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" fill="#262320"><rect width="${N}" height="${N}" fill="#fff"/>${s}${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`;
}
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

  }
  if(f.dataset.form==='newCash'){
    const t = addTx({date:new Date(2026,8,26,new Date().getHours(),new Date().getMinutes()),type:'in',amount:parseFloat(d.amount),min:S.leaderMin,ev:d.ev||null,
      method:d.method.startsWith('Cart')?'Cartão':'Dinheiro',who:'Líder · '+minById(S.leaderMin).short,desc:d.desc.trim(),status:d.method.startsWith('Cart')?'ok':'conferir',origin:'Lançado pelo líder'});
    closeModal(); toast(t.status==='conferir'?`✓ Registrado. Aparece na Tesouraria como "a conferir" até a entrega do dinheiro.`:'✓ Registrado e somado ao ministério'); render();
  }
  if(f.dataset.form==='newExpense'){
    const has = f.querySelector('input[type=file]').files.length>0;
    addTx({date:new Date(2026,8,26,12),type:'out',amount:parseFloat(d.amount),min:S.leaderMin,method:'Transferência',who:d.who||'—',desc:d.desc.trim(),status:'ok',origin:'Lançado pelo líder',receipt:has});
    closeModal(); toast(has?'✓ Despesa registrada com comprovante':'Despesa registrada. ⚠ A tesouraria vai ver que falta o comprovante.'); render();
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

seed(); render();
</script>
